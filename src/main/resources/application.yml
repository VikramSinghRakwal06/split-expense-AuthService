spring:
  application:
    name: auth-service

  profiles:
    # Local development is the default; override with SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow_auth}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: auth-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    # Flyway owns the schema. Hibernate only verifies that the mapped entities
    # agree with the migrated tables and fails fast at startup if they drift.
    hibernate:
      ddl-auto: validate
    # Keeping the persistence context open across view rendering hides lazy-loading
    # bugs and holds a connection for the whole request. Off, always.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  error:
    # Error bodies are produced by GlobalExceptionHandler; never leak the container's.
    include-message: never
    include-stacktrace: never

payflow:
  jwt:
    # 256-bit minimum for HS256. The dev fallback is deliberately obvious so an
    # unset JWT_SECRET in a real environment is easy to spot.
    secret: ${JWT_SECRET:dev-secret-change-me-this-must-be-at-least-32-bytes-long}
    issuer: ${JWT_ISSUER:payflow-auth-service}
    access-token-expiration: ${JWT_ACCESS_TTL:15m}
    refresh-token-expiration: ${JWT_REFRESH_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.payflow.auth: ${LOG_LEVEL:INFO}
